(function(){var p=new URLSearchParams(location.search);var r=p.get("r");var msg=document.getElementById("msg");var sub=document.getElementById("sub");var dl="https://tsumiru.app/download/";var apps={obtainium:"https://github.com/ImranR98/Obtainium",sidestore:dl+"#on-ios",altstore:dl+"#on-ios",feather:dl+"#on-ios"};function link(href,text){var a=document.createElement("a");a.href=href;a.textContent=text;return a;}function nothing(){msg.textContent="Nothing to open.";sub.textContent="";sub.appendChild(link(dl,"Download page"));}if(!r){nothing();return;}var m=/^([a-z0-9+.-]+):/i.exec(r);var scheme=m?m[1].toLowerCase(): "";if(!apps[scheme]){nothing();return;}try{location.replace(r);}catch(e){}msg.textContent="Opening Tsumiru in your app…";sub.textContent="";sub.appendChild(link(apps[scheme],"Nothing happened? Get the app"));sub.appendChild(document.createTextNode(" · "));sub.appendChild(link(dl,"Download page"));})();
